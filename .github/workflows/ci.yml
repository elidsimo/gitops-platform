name: ci-hello-api

on:
  push:
    branches: [main]
    paths:
      - "app-demo/hello-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app-demo/hello-api/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: app-demo/hello-api

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Lancer les tests dans l'étage "test" du Dockerfile
        run: docker build --target test --progress=plain "$APP_DIR"

  build-scan-push:
    name: Build, scan Trivy, publication
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer le nom et le tag de l'image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hello-api" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Construire l'image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg APP_VERSION="$TAG" \
            -t "$IMAGE:$TAG" \
            "$APP_DIR"

      - name: Scanner l'image avec Trivy (bloque si HIGH ou CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:$TAG"

      - name: Se connecter au registre GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publier l'image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:$TAG"
